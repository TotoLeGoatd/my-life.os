<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f5f3" />
    <meta name="description" content="My Life OS — tes défis quotidiens pour progresser dans tous tes domaines." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Life OS" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>My Life OS — 365 Challenges</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navigation principale">
        <a class="brand" href="#dashboard" aria-label="My Life OS, accueil">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 180 180" focusable="false"><defs><linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#242422"/><stop offset="1" stop-color="#151514"/></linearGradient><linearGradient id="mark-line" x1="52" y1="57" x2="128" y2="123"><stop stop-color="#fff"/><stop offset="1" stop-color="#c4c4bd"/></linearGradient></defs><rect width="180" height="180" rx="42" fill="url(#mark-bg)"/><rect x="2" y="2" width="176" height="176" rx="40" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/><path d="M52 123V57l38 45 38-45v66" fill="none" stroke="url(#mark-line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="141" cy="51" r="4" fill="#a8a8a1"/></svg></span>
          <span class="brand-copy"><strong>my life os</strong></span>
        </a>

        <div class="nav-label">MENU</div>
        <nav class="primary-nav">
          <a class="nav-link active" href="#dashboard" data-view="dashboard"><span class="nav-icon" data-icon="grid"></span><span>Accueil</span></a>
          <a class="nav-link" href="#challenges" data-view="challenges"><span class="nav-icon" data-icon="target"></span><span>365 Challenges</span></a>
          <a class="nav-link" href="#progress" data-view="progress"><span class="nav-icon" data-icon="chart"></span><span>Progression</span></a>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-tools">
            <button class="sidebar-tool" id="exportButton"><span data-icon="download"></span> Sauvegarder</button>
            <button class="sidebar-tool" id="importButton"><span data-icon="upload"></span> Restaurer</button>
            <input id="importFile" type="file" accept="application/json,.json" hidden />
          </div>
          <div class="profile"><span class="avatar">365</span><div><strong>Mon parcours</strong><small>Données locales</small></div></div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="topbar-heading"><span class="date-label" id="topbarDate"></span><h1 id="topbarPageTitle">Accueil</h1></div>
          <div class="topbar-actions">
            <button class="icon-button" id="installButton" aria-label="Installer l’application" title="Installer l’application" hidden><span data-icon="download"></span></button>
            <button class="icon-button mobile-only-action" id="exportButtonMobile" aria-label="Sauvegarder les données" title="Sauvegarder"><span data-icon="download"></span></button>
            <button class="icon-button mobile-only-action" id="importButtonMobile" aria-label="Restaurer les données" title="Restaurer"><span data-icon="upload"></span></button>
            <a class="button button-dark button-small desktop-challenge-action" href="#challenges" data-view="challenges"><span data-icon="target"></span><span>Mes défis</span></a>
          </div>
        </header>
        <main id="mainView" class="main-content" tabindex="-1"></main>
        <footer class="mobile-footer" aria-label="Navigation mobile">
          <a class="mobile-nav-link active" href="#dashboard" data-view="dashboard"><span data-icon="grid"></span><small>Accueil</small></a>
          <a class="mobile-nav-link" href="#challenges" data-view="challenges"><span data-icon="target"></span><small>Défis</small></a>
          <a class="mobile-nav-link" href="#progress" data-view="progress"><span data-icon="chart"></span><small>Progression</small></a>
        </footer>
      </div>
    </div>

    <dialog id="challengeDialog" class="modal modal-narrow">
      <form id="challengeForm" class="modal-form">
        <div class="modal-heading"><div><div class="eyebrow">365 CHALLENGES</div><h2>Ton retour</h2></div><button class="icon-button close-dialog" type="button" aria-label="Fermer"><span data-icon="close"></span></button></div>
        <input type="hidden" name="id" />
        <p id="challengeDialogPrompt" class="dialog-prompt"></p>
        <label class="field-label">Commentaire<textarea name="comment" rows="5" maxlength="2000" placeholder="Une pensée, une difficulté, une petite victoire…"></textarea></label>
        <div class="modal-actions"><button class="button button-quiet close-dialog" type="button">Annuler</button><button class="button button-dark" type="submit"><span data-icon="check"></span> Enregistrer</button></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
